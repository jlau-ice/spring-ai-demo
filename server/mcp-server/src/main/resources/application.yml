server:
  port: 8014
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
spring:
  application:
    name: mcp-server
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1
      connect-timeout: 3
      timeout: 3
  ai:
    dashscope:
      api-key: ${DASH_SCOPE_API_KEY}
      base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      chat:
        options:
          model: "qwen-plus-2025-09-11"
    vectorstore:
      redis:
        index-name: "custom-index"
        prefix: "custom-prefix:"
        initialize-schema: true

