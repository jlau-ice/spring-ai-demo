server:
  port: 8016
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true
spring:
  application:
    name: mcp-client
  ai:
    dashscope:
      api-key: ${DASH_SCOPE_API_KEY}
      base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      chat:
        options:
          model: "qwen-plus-2025-09-11"
    mcp:
      client:
        request-timeout: 1660s
        enabled: true
        stdio:
          servers-configuration: classpath:/pgsql-mcp.json5